# CPU is the signal here. To also scale on the ingest backlog use optional/keda-ingest-lag.yaml instead of this file (one autoscaler per Deployment).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: funnels }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: funnels }
  minReplicas: 4
  maxReplicas: 24
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 1, periodSeconds: 60 }] }
