name = "funnels-edge"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Route every customer hostname (a wildcard zone route, or one route per custom hostname with Cloudflare for SaaS).
# routes = [{ pattern = "*/*", zone_name = "sites.example.com" }]

[vars]
ORIGIN_URL = "https://app.example.com"
CACHE_TTL_SECONDS = "60"      # serve from cache without asking the origin
STALE_SECONDS = "86400"       # serve stale (and revalidate in the background) up to this age

# KV caches routing results (404 / redirects) so unknown paths do not hit the origin.
# wrangler kv namespace create ROUTES
# [[kv_namespaces]]
# binding = "ROUTES"
# id = "<namespace id>"

# --- Rate limiting at the edge (docs/RATE-LIMITING.md, docs/CLOUDFLARE.md) ---
# Workers Rate Limiting bindings: cheap per-location flood protection for the public endpoints. limit = requests per period (10 or 60 seconds).
# [[unsafe.bindings]]
# name = "RL_EVENTS"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 100, period = 10 }
# [[unsafe.bindings]]
# name = "RL_FORMS"
# type = "ratelimit"
# namespace_id = "1002"
# simple = { limit = 20, period = 60 }
#
# Durable Object GCRA: exact worldwide counts for forms and checkout (one object per client IP).
# [[durable_objects.bindings]]
# name = "RL_DO"
# class_name = "RateLimiterDO"
# [[migrations]]
# tag = "v1"
# new_classes = ["RateLimiterDO"]
# EDGE_FORMS_PER_MINUTE = "30" and EDGE_FORMS_BURST = "10" go under [vars].

# --- Event queue (docs/SCALING.md, docs/CLOUD-LOADTEST.md) ---
# The Worker answers POST /api/public/events with 202 and queues the beacon; the consumer forwards batches to the origin (/internal/edge/events),
# which publishes them to its own ingest queue. A traffic spike is absorbed here and never touches the database synchronously.
# wrangler queues create funnels-events ; wrangler queues create funnels-events-dlq
# [[queues.producers]]
# binding = "EVENTS_QUEUE"
# queue = "funnels-events"
# [[queues.consumers]]
# queue = "funnels-events"
# max_batch_size = 100
# max_batch_timeout = 2
# max_retries = 10
# dead_letter_queue = "funnels-events-dlq"

# Secrets (never in this file):  wrangler secret put EDGE_SHARED_SECRET ; wrangler secret put CF_ORIGIN_SECRET
