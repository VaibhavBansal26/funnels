# Local stack for THIS app: the app on PostgreSQL 17 (default), or on SQLite with --profile sqlite.
# docker compose up --build                          -> http://localhost:3000 (PostgreSQL)
# docker compose --profile sqlite up --build app-sqlite -> SQLite on a volume (single replica)
# docker compose --profile edge up -> also runs the edge worker locally through wrangler (needs the secrets below)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: funnels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnels-local-only}
      POSTGRES_DB: funnels
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funnels -d funnels"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
  app:
    build: .
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://funnels:${POSTGRES_PASSWORD:-funnels-local-only}@postgres:5432/funnels
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in your shell or .env}
      # encrypts TOTP seeds and the analytics identity pepper (32+ chars, `openssl rand -hex 32`); the default is for local trials only
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-6b1f0c9e4a7d2358e1b64f0a93c7d5128fa4e6b0c3d97a15e28f4b6c0d1a7e93}
      APP_PUBLIC_URL: http://localhost:3000
      APP_PUBLIC_CNAME_TARGET: sites.localhost
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:-}
      CF_ORIGIN_SECRET: ${CF_ORIGIN_SECRET:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      TRUST_PROXY: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 3s
  app-sqlite:
    profiles: ["sqlite"]
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in your shell or .env}
      # encrypts TOTP seeds and the analytics identity pepper (32+ chars, `openssl rand -hex 32`); the default is for local trials only
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-6b1f0c9e4a7d2358e1b64f0a93c7d5128fa4e6b0c3d97a15e28f4b6c0d1a7e93}
      APP_PUBLIC_URL: http://localhost:3000
      APP_PUBLIC_CNAME_TARGET: sites.localhost
      TRUST_PROXY: "true"
    volumes: ["funnels-data:/data"]
  edge:
    profiles: ["edge"]
    image: node:22-alpine
    working_dir: /edge
    volumes: ["./edge:/edge"]
    command: sh -c "npm ci && npx wrangler dev --local --port 8787 --var ORIGIN_URL:http://app:3000 --var EDGE_SHARED_SECRET:$${EDGE_SHARED_SECRET}"
    environment:
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:-}
    ports: ["8787:8787"]
    depends_on: [app]
volumes:
  funnels-data:
  pg-data:
